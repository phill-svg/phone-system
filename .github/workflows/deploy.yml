# Deploys the worker to Cloudflare on every push to master, and on demand from the Actions tab
# ("Run workflow") — which is how you deploy from a phone, with no terminal involved.
#
# One-time setup: add two repository secrets (Settings → Secrets and variables → Actions).
#   CLOUDFLARE_API_TOKEN  — "Edit Cloudflare Workers" template plus D1 edit, so this can both apply
#                           migrations and publish.
#   CLOUDFLARE_ACCOUNT_ID — the hex id in your Cloudflare dashboard URL. Required, not optional:
#                           without it wrangler tries to discover the account via the /memberships
#                           API, which a scoped API token is not allowed to call, and every step
#                           fails with "A request to the Cloudflare API (/memberships) failed."
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys of the same branch overwrite each other; the newer push wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Without the token every later step dies deep inside wrangler ("You must be logged in…"),
      # which reads like a code failure rather than a missing secret. Say so plainly, up front.
      - name: Check the Cloudflare secrets are set
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings → Secrets and variables → Actions → Secrets tab → Repository secrets (not Variables, not Environment secrets, and not the Cloudflare dashboard), then re-run this workflow. The account id is the hex string in your Cloudflare dashboard URL."
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The worker's tests run in the Cloudflare workers pool, which needs the API token: some
      # bindings (the AI one) are proxied to the real Cloudflare edge even for local test runs.
      - name: Test
        run: npm test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `wrangler deploy` does NOT apply D1 migrations, so any release carrying a new migration
      # would ship code that queries a column the database doesn't have yet. Applying first keeps
      # the two in step; already-applied migrations are skipped.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply tcb-voip-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
