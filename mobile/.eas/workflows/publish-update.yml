# Publishes the JS/UI layer over-the-air via EAS Update, so a mobile fix reaches
# handsets without a store build. Native changes still need `eas build`.
#
# Deliberately manual: there is no `on:` trigger, because a push to master already
# deploys the worker and a device publish should stay a decision someone makes.
# Run it from the EAS dashboard, or with:
#
#   cd mobile && npx eas workflow:run .eas/workflows/publish-update.yml
#
# Bump OTA_BUILD in src/lib/build.ts first (read it off origin/master, never your checkout) --
# that constant is how you confirm on-device (Settings) that the update actually landed.
#
# The GitHub Actions "Publish OTA" workflow (.github/workflows/publish-ota.yml) is the preferred
# path: it also prefixes the message with the OTA number. This one now runs the same typecheck and
# tests before publishing -- it used to publish with neither, so a broken bundle could go straight
# to every handset on the channel.
name: Publish OTA update

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options:
          - production
          - preview
          - test
          - development
        required: false
        description: Build channel to publish to. Must match the channel of the installed build.
      message:
        type: string
        required: false
        description: Shown against the update in the EAS dashboard.

jobs:
  checks:
    name: Typecheck and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test -- --ci

  publish_update:
    name: Publish update
    needs: [checks]
    type: update
    # Matches the production build profile, so env vars resolve the same way here
    # as they did when the installed binary was built.
    environment: production
    params:
      channel: ${{ inputs.channel || 'production' }}
      message: ${{ inputs.message || 'Manual publish' }}
      platform: all
